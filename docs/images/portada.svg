<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0d2033"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="700" fill="url(#bg)"/>
<circle cx="1230" cy="160" r="190" fill="#22d3ee" opacity=".08" filter="url(#shadow)"/>
<circle cx="1380" cy="500" r="240" fill="#60a5fa" opacity=".06" filter="url(#shadow)"/>

<!-- circuit traces -->
<g fill="none" stroke="#22d3ee" stroke-width="3" opacity=".28">
  <path d="M60 90H330V145H470"/>
  <path d="M70 610H280V550H430"/>
  <path d="M1260 80H1450V145H1535"/>
  <path d="M1180 620H1390V565H1540"/>
</g>
<g fill="#67e8f9" opacity=".7">
  <circle cx="330" cy="90" r="6"/><circle cx="470" cy="145" r="6"/>
  <circle cx="280" cy="610" r="6"/><circle cx="430" cy="550" r="6"/>
  <circle cx="1450" cy="80" r="6"/><circle cx="1535" cy="145" r="6"/>
</g>

<!-- title -->
<text x="90" y="185" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="700" letter-spacing="3">LOCOMESH</text>
<text x="94" y="255" fill="url(#glow)" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="8">GATEWAY</text>
<text x="94" y="315" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Z21 LAN · XPRESSNET · DCC · EMBEDDED CONTROL</text>

<!-- central gateway -->
<g transform="translate(720 105)">
  <rect x="0" y="0" width="500" height="285" rx="24" fill="#111c2d" stroke="#38bdf8" stroke-width="3"/>
  <rect x="25" y="25" width="450" height="235" rx="16" fill="#0a1423" stroke="#334155" stroke-width="2"/>
  <!-- ESP -->
  <rect x="55" y="62" width="160" height="150" rx="12" fill="#16283a" stroke="#22d3ee" stroke-width="2"/>
  <text x="135" y="125" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="28" font-weight="700">ESP8266</text>
  <text x="135" y="158" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="18">WiFi / UDP / Web</text>
  <!-- Mega -->
  <rect x="285" y="62" width="160" height="150" rx="12" fill="#16283a" stroke="#60a5fa" stroke-width="2"/>
  <text x="365" y="118" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="24" font-weight="700">ATmega2560</text>
  <text x="365" y="153" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="17">Z21 / XpressNet</text>
  <path d="M215 137H285" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="250" cy="137" r="8" fill="#67e8f9"/>
  <text x="250" y="238" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="15">SERIAL3 LINK</text>
</g>

<!-- network node -->
<g transform="translate(1280 145)">
  <circle cx="0" cy="0" r="58" fill="#0b2233" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="0" cy="0" r="22" fill="none" stroke="#67e8f9" stroke-width="3"/>
  <path d="M-34 5C-22-15 22-15 34 5M-48 20C-25-12 25-12 48 20" fill="none" stroke="#67e8f9" stroke-width="3"/>
  <text x="0" y="90" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="19">Z21 LAN</text>
</g>

<!-- railway -->
<g transform="translate(70 470)">
  <path d="M0 55H1460" stroke="#64748b" stroke-width="8"/>
  <path d="M0 145H1460" stroke="#64748b" stroke-width="8"/>
  <g stroke="#334155" stroke-width="10">
    <path d="M40 35V165M130 35V165M220 35V165M310 35V165M400 35V165M490 35V165M580 35V165M670 35V165M760 35V165M850 35V165M940 35V165M1030 35V165M1120 35V165M1210 35V165M1300 35V165M1390 35V165"/>
  </g>
  <!-- train silhouette -->
  <g transform="translate(530 8)">
    <rect x="0" y="20" width="330" height="105" rx="12" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
    <rect x="25" y="42" width="70" height="38" rx="5" fill="#0ea5e9" opacity=".75"/>
    <rect x="110" y="42" width="70" height="38" rx="5" fill="#0ea5e9" opacity=".75"/>
    <rect x="195" y="42" width="70" height="38" rx="5" fill="#0ea5e9" opacity=".75"/>
    <circle cx="65" cy="132" r="20" fill="#0f172a" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="265" cy="132" r="20" fill="#0f172a" stroke="#94a3b8" stroke-width="4"/>
  </g>
</g>

<!-- protocol labels -->
<g font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">
  <text x="95" y="410" fill="#67e8f9">WiFi</text>
  <text x="220" y="410" fill="#93c5fd">UDP 21105</text>
  <text x="405" y="410" fill="#a5b4fc">Z21</text>
  <text x="510" y="410" fill="#c4b5fd">XpressNet</text>
  <text x="690" y="410" fill="#94a3b8">RS485</text>
</g>

<text x="800" y="670" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2">OPEN HARDWARE · OPEN SOFTWARE · MODEL RAILWAY CONTROL</text>
</svg>